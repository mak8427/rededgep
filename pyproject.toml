[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rededgep"
version = "0.1.0"
description = "MicaSense RedEdge-P raw to calibrated reflectance, Metashape-compatible"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Davide Mattioli"}]
keywords = ["micasense", "rededge-p", "reflectance", "radiometry", "uas", "multispectral", "metashape"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy>=1.22", "pillow>=9.0"]

[project.optional-dependencies]
geo = ["gdal>=3.4"]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/mak8427/rededgep"
Source = "https://github.com/mak8427/rededgep"

[tool.setuptools.packages.find]
where = ["src"]
